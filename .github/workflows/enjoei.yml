name: Verificar Enjoei

on:
  schedule:
    - cron: "0 11 * * *"        # 08:00 em Brasilia (UTC-3)
  workflow_dispatch:
    inputs:
      teste_email:
        description: "Enviar apenas um e-mail de teste"
        type: boolean
        default: false
  push:                         # editar alertas/anuncios pelo app tambem dispara a busca
    paths:
      - "docs/data/alerts.json"
      - "docs/data/watch.json"
      - "docs/data/discarded.json"
      - "docs/data/run.json"

permissions:
  contents: write

concurrency:
  group: enjoei
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar anuncios e enviar resumo
        run: python enjoei_alert.py ${{ inputs.teste_email && '--test-email' || '' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          APP_URL: ${{ vars.APP_URL }}
      - name: Salvar resultados
        run: |
          git config user.name "enjoei-bot"
          git config user.email "enjoei-bot@users.noreply.github.com"
          # So grava os arquivos gerados pelo robo, sempre sobre a versao mais recente
          mkdir -p /tmp/dados
          cp docs/data/seen.json docs/data/watchstate.json docs/data/results.json /tmp/dados/
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dados/*.json docs/data/
            git add docs/data/seen.json docs/data/watchstate.json docs/data/results.json
            git diff --cached --quiet && exit 0
            git commit -m "dados: atualizacao automatica"
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1

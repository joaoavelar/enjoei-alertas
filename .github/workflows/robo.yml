name: Robo (multiusuario)

on:
  schedule:
    - cron: "*/15 * * * *"     # verifica quem esta devido (cada alerta a cada 3h, ou quando pedido no app)
    - cron: "17 12 1 * *"      # 1x por mes: mantem o agendamento ativo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install "pywebpush>=1.14,<3"
      - name: Buscar, gravar e avisar
        run: python robo.py
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          APP_URL: ${{ vars.APP_URL }}
      - name: Manter o agendamento ativo
        if: github.event.schedule == '17 12 1 * *'
        run: |
          git config user.name "enjoei-bot"
          git config user.email "enjoei-bot@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/ativo.txt
          git add .github/ativo.txt
          git commit -m "mantem o agendamento ativo" && git push
